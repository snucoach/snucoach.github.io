# 로컬 검증용 Supabase 최소 구성 (DB · 인증 · REST · 메일 수신함)
# 실제 서비스는 supabase.com 프로젝트를 쓴다. 이 파일은 개발·테스트 전용이다.
# 실행은 ./up.sh 로 한다(비밀값을 매번 새로 만들어 .env 에 쓴다).
name: snucoach-sb

services:
  db:
    image: supabase/postgres:17.6.1.178
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    ports: ["127.0.0.1:54322:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 60

  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9999:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:8080
      GOTRUE_URI_ALLOW_LIST: http://localhost:8080/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@snucoach.test
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: 스누코치
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # 저장소의 한국어 메일 템플릿을 그대로 읽어 실제와 같은 메일을 만든다.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${TPL_BASE}/confirm-signup.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${TPL_BASE}/reset-password.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "[스누코치] 이메일 인증을 완료해 주세요"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "[스누코치] 비밀번호 재설정 안내"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_CURRENT_PASSWORD: ${REQUIRE_CURRENT_PASSWORD:-false}
      GOTRUE_LOG_LEVEL: info

  rest:
    image: postgrest/postgrest:v14.18
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_MAX_ROWS: 1000

  mail:
    image: axllent/mailpit:v1.31.3
    ports: ["127.0.0.1:8025:8025"]
